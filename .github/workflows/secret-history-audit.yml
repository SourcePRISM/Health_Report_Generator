name: Audit repository secret history
on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * 1'
permissions:
  contents: read
concurrency:
  group: secret-history-audit-${{ github.ref }}
  cancel-in-progress: false
jobs:
  history-audit:
    name: history-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Audit fetched repository branches and tags
        run: bash scripts/ci/secret_audit.sh https://github.com/SourcePRISM/Health_Report_Generator.git
